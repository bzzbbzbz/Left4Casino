[bot]
# For safe staging/prod workflow create two local copies that are NOT committed:
#   cp settings.example.toml settings.prod.toml
#   cp settings.example.toml settings.stage.toml
# Then run each bot with its own CONFIG_FILE_PATH and CASINO_DB_PATH.
# Production and staging must use different bot tokens.
# Bot token. Obtain one from https://t.me/botfather
token = "1234567890:AaBbCcDdEeFfGrOoShALlMmNnOoPpQqRrSs"
# Where to store users' data. Options: "memory", "redis".
# Memory storage gets wiped upon bot restart, Redis uses persistency.
fsm_mode = "redis"


[redis]
# In case you select "Redis" fsm_mode, specify connection string here
dsn = "redis://user:pass@host:port"


[logs]
# Project name. Used in logs, useful when aggregating logs from different bots.
project_name = "casino_bot"
# If true, logs will include date and time of the event
show_datetime = true
# Datetime format in logs
datetime_format = "%Y-%m-%d %H:%M:%S"
# If true, logs with DEBUG level will be shown. Otherwise, only INFO+
show_debug_logs = false
# If true, logs will use UTC time instead of server's local time
time_in_utc = false
# How to show logs. Options: "console", "json"
renderer = "json"
# If true, "console" renderer will use colors when rendering logs
use_colors_in_console = false
# If true, logs from other libraries (e.g. aiogram) will be shown
allow_third_party_logs = true


[game_config]
# Starting points for all new games
starting_points = 50
# Whether to send a special "game over" sticker or not. Specify sticker's file id in localization file
send_gameover_sticker = true
# Throttling time for spins. Casino dice animation is variable, on average ~2 seconds long
throttle_time_spin = 2
# Throttling time for all other actions.
throttle_time_other = 1
# Throttling time for /top (leaderboard) in seconds.
throttle_time_top = 5

[chat_restrictions]
# If true, the bot will ignore messages in private chats (DM)
block_private_chats = false
# List of allowed chat IDs (whitelist). If empty, all group chats are allowed.
# Example: allowed_chat_ids = [-100123456789, -100987654321]
# For staging, specify only test chat IDs here to prevent accidental replies in production chats.
allowed_chat_ids = []

[reports]
# Timezone for daily reports
timezone = "Asia/Yekaterinburg"
# User ID to send draft reports to (optional)
admin_id = 123456789

[ai]
provider = "mock"
api_key = "dummy"
model = "deepseek/deepseek-chat"
credit_cooldown_minutes = 15

[dice_fights]
challenge_timeout_minutes = 5
roll_timeout_minutes = 5
max_debt = 100
min_bet = 1

[heist]
# Enable/disable heist event
enabled = true
# Number of heist events per day
events_per_day = 1
# Heist only happens during active hours (never at night)
active_hours_start = "08:00"
active_hours_end = "02:00"

# Economy (% of B - yesterday's total winnings in chat)
pot_cap_pct = 7               # max pot = B × % (досрочная Фаза 2)
min_pot_pct = 1.5               # min pot for completion without extension
seed_min_pct = 0.5            # min seed from croupier = B × 0.5%
seed_max_pct = 2            # max seed from croupier = B × 2%
commission_pct = 15           # croupier commission (destroyed from economy)
base_value_noise_pct = 15     # ±15% noise to B (masking)
base_value_fallback = 1000    # B if no data from yesterday

# Timings
warning_before_minutes = 10   # warning N minutes before start
phase1_min_minutes = 10       # min duration of Phase 1
phase1_max_minutes = 25       # max duration of Phase 1
phase2_min_minutes = 2        # min duration of Phase 2
phase2_max_minutes = 5        # max duration of Phase 2
seed_delay_minutes = 5        # after how many minutes croupier adds seed
max_duration_minutes = 30     # absolute hard cap

# Croupier messages
croupier_message_interval_seconds = 120  # interval between messages
